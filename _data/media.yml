- id: final-fantasy-vi
  title: Final Fantasy VI
  type: game
  creator: Square Enix
  year: 1994
  started: '2021-01'
  finished: '2026-06'
  rating: 5
  comment: Mostly to kill time on flights. It’s funny how similar and how different FF is from DQ- The
    story has had it’s foot on the gas from the very start and exploration has been very light. There
    seems to be a ton of party members with different abilities, but the game has been really easy so
    far so the mechanics are mostly just for fun. Some gorgeous spritework on the backgrounds and environments,
    but the character sprites (not portraits) are samey and weirdly top-heavy, and the monsters haven’t
    been very memorable. Not having been a fan of the “steal” mechanic in FF games, I got a sensible chuckle
    after stealing the clothes off some poor guy during a stealth section.
