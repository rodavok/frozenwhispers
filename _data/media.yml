- id: mole-mania
  title: Mole Mania
  type: game
  creator: Nintendo Entertainment Analysis & Development
  year: 1996
  started: '2025-01'
  finished: '2025-12'
  rating: 5
  comment: Hidden gem produced by Miyamoto. Not surprising so many people missed this - it came out too
    late in the Gameboy’s lifespan and the mole is really not the most charismatic animal, but this is
    a really neat game. It’s an ambitious expansion on the well-worn Sokoban formula. There’s an emphasis
    on pushing, but also rolling, and suplexing a ball towards the goal, with enemies, pipes, conveyor
    belts. Has a handful of bosses, all of which are completely unique. Bonus points for the level where
    the enemies are all nearly nude, tanned buff beach dudes.
