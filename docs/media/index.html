<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <div class="background-layer"></div>

  <div class="site-container">
    <header class="site-header">
      <a href="/" class="site-title">Frozen Whispers</a>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/reading">Reading</a>
        <a href="/media">Media</a>
        <a href="/energy">Energy</a>
        <a href="/about">About</a>

    </header>

    <main class="content-pane">
      <article class="page">
  <header class="page-header">
    <h1 class="page-title">Media</h1>
  </header>

  <div class="page-content">
    
<div class="media-controls">
  <input type="search" id="media-search" class="media-search" placeholder="Filter by title or creator…" aria-label="Filter media" />
  <div class="media-filters" role="group" aria-label="Filter by type">
    <button type="button" class="media-filter is-active" data-type="all">All</button>
    
    
    <button type="button" class="media-filter" data-type="book">book</button>
    
  </div>
</div>

<table class="media-table" id="media-table">
  <thead>
    <tr>
      <th class="col-cover" aria-label="Cover"></th>
      <th class="col-title sortable" data-sort="title">Title</th>
      <th class="col-type sortable" data-sort="type">Type</th>
      <th class="col-creator sortable" data-sort="creator">Creator</th>
      <th class="col-year sortable" data-sort="year">Year</th>
      <th class="col-date sortable" data-sort="started">Started</th>
      <th class="col-date sortable" data-sort="finished">Finished</th>
      <th class="col-rating sortable" data-sort="rating">Rating</th>
    </tr>
  </thead>
  <tbody>
    
    
    <tr class="media-row" data-title="habsburgs: to rule the world" data-type="book" data-creator="martyn rady" data-year="2020" data-started="2026-07-28" data-finished="2026-08-27" data-rating="5">
      <td class="col-cover">
        
        <img src="/assets/covers/habsburgs-to-rule-the-world.jpg" alt="" loading="lazy" class="media-cover" />
        
      </td>
      <td class="col-title">
        
        <a href="https://openlibrary.org/works/OL20758556W" rel="noopener">Habsburgs: To Rule the World</a>
        
        
      </td>
      <td class="col-type"><span class="media-type">book</span></td>
      <td class="col-creator">Martyn Rady</td>
      <td class="col-year">2020</td>
      <td class="col-date">2026-07-28</td>
      <td class="col-date">2026-08-27</td>
      <td class="col-rating">
        
        <span class="media-stars" title="5 out of 5">★★★★★</span>
        
      </td>
    </tr>
    
    
  </tbody>
</table>

<p class="media-count"><span id="media-shown">1</span> of 1 entries</p>

<script>
(function() {
  var table = document.getElementById('media-table');
  if (!table) return;

  var tbody = table.querySelector('tbody');
  var search = document.getElementById('media-search');
  var shownCount = document.getElementById('media-shown');
  var activeType = 'all';

  /* Rows come in pairs: the entry row, optionally followed by its comment row. */
  function pairs() {
    var out = [];
    Array.prototype.forEach.call(tbody.children, function(row) {
      if (row.classList.contains('media-row')) {
        out.push({ row: row, comment: null });
      } else if (row.classList.contains('media-comment-row') && out.length) {
        out[out.length - 1].comment = row;
      }
    });
    return out;
  }

  function toggle(pair) {
    if (!pair.comment) return;
    var open = !pair.comment.hidden;
    pair.comment.hidden = open;
    pair.row.classList.toggle('is-open', !open);
    pair.row.setAttribute('aria-expanded', String(!open));
  }

  tbody.addEventListener('click', function(e) {
    if (e.target.closest('a')) return;   /* let source links through */
    var row = e.target.closest('.media-row');
    if (!row) return;
    pairs().forEach(function(p) { if (p.row === row) toggle(p); });
  });

  tbody.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest('.media-row');
    if (!row) return;
    e.preventDefault();
    pairs().forEach(function(p) { if (p.row === row) toggle(p); });
  });

  function applyFilters() {
    var term = search.value.trim().toLowerCase();
    var shown = 0;

    pairs().forEach(function(pair) {
      var d = pair.row.dataset;
      var matchesType = activeType === 'all' || d.type === activeType;
      var matchesTerm = !term ||
        d.title.indexOf(term) !== -1 ||
        d.creator.indexOf(term) !== -1;
      var visible = matchesType && matchesTerm;

      pair.row.hidden = !visible;
      if (pair.comment) {
        /* Collapse hidden rows so they don't reappear expanded. */
        if (!visible) {
          pair.comment.hidden = true;
          pair.row.classList.remove('is-open');
          pair.row.setAttribute('aria-expanded', 'false');
        }
      }
      if (visible) shown++;
    });

    shownCount.textContent = shown;
  }

  search.addEventListener('input', applyFilters);

  Array.prototype.forEach.call(document.querySelectorAll('.media-filter'), function(button) {
    button.addEventListener('click', function() {
      activeType = button.dataset.type;
      document.querySelectorAll('.media-filter').forEach(function(b) {
        b.classList.toggle('is-active', b === button);
      });
      applyFilters();
    });
  });

  var sortKey = null;
  var sortAsc = true;

  /* Unrated entries carry -1 and unknown years 0; both mean "no value",
     as distinct from a real rating of 0. */
  function isMissing(row, key) {
    var raw = row.dataset[key];
    if (key === 'rating') return Number(raw) < 0;
    if (key === 'year') return Number(raw) === 0;
    return !raw;
  }

  function sortValue(row, key) {
    var raw = row.dataset[key];
    if (key === 'year' || key === 'rating') return Number(raw);
    return raw || '';
  }

  Array.prototype.forEach.call(table.querySelectorAll('.sortable'), function(header) {
    header.addEventListener('click', function() {
      var key = header.dataset.sort;
      sortAsc = sortKey === key ? !sortAsc : true;
      sortKey = key;

      var sorted = pairs().sort(function(a, b) {
        var av = sortValue(a.row, key);
        var bv = sortValue(b.row, key);
        /* Missing values sort last regardless of direction. */
        var aMissing = isMissing(a.row, key);
        var bMissing = isMissing(b.row, key);
        if (aMissing !== bMissing) return aMissing ? 1 : -1;
        if (aMissing && bMissing) return 0;
        if (av === bv) return 0;
        return (av > bv ? 1 : -1) * (sortAsc ? 1 : -1);
      });

      sorted.forEach(function(pair) {
        tbody.appendChild(pair.row);
        if (pair.comment) tbody.appendChild(pair.comment);
      });

      table.querySelectorAll('.sortable').forEach(function(h) {
        h.classList.remove('sort-asc', 'sort-desc');
      });
      header.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    });
  });
})();
</script>


  </div>
</article>
